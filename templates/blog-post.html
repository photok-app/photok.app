<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} – Photok Blog</title>
  <meta name="description" content="{{description}}" />
  <meta name="author" content="{{author}}" />
  <link rel="canonical" href="{{url}}" />
  <link rel="alternate" type="application/rss+xml" title="Photok Blog" href="/blog/feed.xml" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Photok" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{url}}" />
  <meta property="og:image" content="{{image}}" />
  <meta property="article:published_time" content="{{date}}" />
  <meta property="article:modified_time" content="{{modified}}" />
  <meta property="article:author" content="{{author}}" />
  <meta name="twitter:card" content="{{twitter_card}}" />
  <link rel="icon" href="https://raw.githubusercontent.com/leonlatsch/Photok/main/fastlane/metadata/android/en-US/images/icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lobster&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/blog/blog.css" />
  <script type="application/ld+json">{{json_ld}}</script>
</head>
<body class="blog-body">
  <!-- {{generated_marker}} -->

{{nav}}

  <main class="container">
    <header class="blog-hero blog-hero--post">
      <a href="/blog/" class="back-link">← All posts</a>
      <h1>{{title}}</h1>
      <p class="blog-meta">{{byline}}</p>
{{tags}}
    </header>
{{cover}}
    <article class="blog-prose">
{{content}}
    </article>
  </main>

{{footer}}
</body>
</html>
